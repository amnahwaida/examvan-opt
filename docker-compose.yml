services:
  db:
    image: postgres:16-alpine
    container_name: examvan-cpp-db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB"]
    environment:
      POSTGRES_DB: examvan
      POSTGRES_USER: examvan
      POSTGRES_PASSWORD: ${DB_PASSWORD?ERR:DB_PASSWORD not set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examvan"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1G
    cpus: '0.5'
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: examvan-cpp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 64M
    cpus: '0.25'
    networks: [internal]

  webui-cpp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: examvan-cpp-server
    restart: unless-stopped
    expose: ["5000"]
    environment:
      EXAMVAN_SECRET: ${EXAMVAN_SECRET?ERR:EXAMVAN_SECRET not set}
      EXAMVAN_ADMIN_USER: ${EXAMVAN_ADMIN_USER:-superadmin}
      EXAMVAN_ADMIN_PASS: ${EXAMVAN_ADMIN_PASS?ERR:EXAMVAN_ADMIN_PASS not set}
      DATABASE_URL: postgresql://examvan:${DB_PASSWORD?ERR:DB_PASSWORD not set}@db:5432/examvan
      REDIS_URL: redis://redis:6379/0
      PORT: 5000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?ERR:R2_ACCESS_KEY_ID not set}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?ERR:R2_SECRET_ACCESS_KEY not set}
      R2_BUCKET: ${R2_BUCKET:-examvan-pdfs}
      R2_ENDPOINT: ${R2_ENDPOINT:?ERR:R2_ENDPOINT not set}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-60}
      PROTOBUF_MANDATORY: ${PROTOBUF_MANDATORY:-0}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 512M
    cpus: '0.5'
    init: true
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    container_name: examvan-cpp-nginx
    restart: unless-stopped
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      webui-cpp: {condition: service_healthy}
    mem_limit: 64M
    cpus: '0.25'
    networks: [internal]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge

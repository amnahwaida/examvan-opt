syntax = "proto3";
package examvan.v1;
option cc_enable_arenas = true;

message Heartbeat {
  int32 exam_id = 1;
  string mac_address = 2;
  string student_name = 3;
  string exam_number = 4;
  string student_class = 5;
  string device_info = 6;
  string last_seen = 7;
  string event = 8;
}

message ExamCompleted {
  int32 exam_id = 1;
  string mac_address = 2;
  string event = 3;
}

message WsEnvelope {
  string event = 1;
  bytes payload = 2;
}

message Exam {
  int32 id = 1;
  string name = 2;
  string token = 3;
  string file_path = 4;
  int64 size_bytes = 5;
  string status = 6;
  string created_at = 7;
}

message CreateExamRequest {
  string name = 1;
  string file_path = 2;
  int64 size_bytes = 3;
  string custom_token = 4;
  bytes pdf_data = 5;
}

message CreateExamResponse {
  bool success = 1;
  int32 id = 2;
  string token = 3;
  string name = 4;
  string file_path = 5;
  string error = 6;
  string error_code = 7;
}

message SubmissionJob {
  string job_id = 1;
  int32 exam_id = 2;
  string student_name = 3;
  string exam_number = 4;
  string student_class = 5;
  string mac_address = 6;
  int32 retries = 7;
  string enqueued_at = 8;
}

message HealthResponse {
  string status = 1;
  string version = 2;
  bool uwebsockets = 3;
  string db = 4;
  string redis = 5;
  int32 queue = 6;
  int64 uptime = 7;
}

message DashboardStats {
  bool success = 1;
  int32 total = 2;
  int32 active = 3;
  int32 storage_mb = 4;
  int32 exams = 5;
  int32 submissions = 6;
}

message User {
  int32 id = 1;
  string username = 2;
  string role = 3;
}

message UserList {
  bool success = 1;
  repeated User users = 2;
  int32 total = 3;
}

message Voucher {
  string code = 1;
  string package = 2;
}

message VoucherList {
  bool success = 1;
  repeated Voucher vouchers = 2;
}

message Settings {
  bool success = 1;
  bool email_verification_enabled = 2;
  string smtp_host = 3;
  int32 smtp_port = 4;
  string smtp_user = 5;
  string smtp_password = 6;
  string smtp_sender_name = 7;
  int32 default_max_exams = 8;
  int32 default_max_concurrent_exams = 9;
  int32 default_max_pdf_size_mb = 10;
  int32 default_max_storage_size_mb = 11;
  int32 default_active_days = 12;
  string android_version = 13;
  string webapp_version = 14;
  string seo_title = 15;
  string seo_description = 16;
  string seo_keywords = 17;
  bool seo_index = 18;
  string footer_text = 19;
}

message PengawasExam {
  int32 id = 1;
  string name = 2;
  string token = 3;
  string status = 4;
}

message PengawasExamList {
  bool success = 1;
  repeated PengawasExam exams = 2;
  bool is_privileged = 3;
  int32 page = 4;
  int32 per_page = 5;
  int32 total = 6;
  int32 total_pages = 7;
}

// ---- Admin exams ----
message AdminExamList {
  bool success = 1;
  repeated Exam exams = 2;
  int32 total = 3;
}

message UpdateExamResponse {
  bool success = 1;
  bool ok = 2;
  int32 id = 3;
  string error = 4;
}

message DeleteExamResponse {
  bool success = 1;
  bool ok = 2;
}

message GenericSuccess {
  bool success = 1;
  bool ok = 2;
}

// ---- Admin submissions ----
message Submission {
  int32 id = 1;
  int32 exam_id = 2;
  string student_name = 3;
  string exam_number = 4;
  string student_class = 5;
  string status = 6;
  int32 score = 7;
  string submitted_at = 8;
}

message SubmissionList {
  bool success = 1;
  repeated Submission submissions = 2;
  int32 total = 3;
}

message SubmissionDetail {
  bool success = 1;
  string exam_name = 2;
  string exam_active_token = 3;
  string student_name = 4;
  string student_class = 5;
  string status = 6;
  int32 score = 7;
  string submitted_at = 8;
}

message QueueStatusResponse {
  bool success = 1;
  int32 pending = 2;
  int32 failed = 3;
}

message DeleteSubmissionResponse {
  bool success = 1;
  bool ok = 2;
}

// ---- Admin pengawas ----
message PengawasSubmission {
  int32 id = 1;
  string student_name = 2;
  string exam_number = 3;
  string status = 4;
  string submitted_at = 5;
}

message PengawasSubmissionList {
  bool success = 1;
  string exam_name = 2;
  string exam_active_token = 3;
  repeated PengawasSubmission submissions = 4;
  int32 page = 5;
  int32 per_page = 6;
  int32 total = 7;
  int32 total_pages = 8;
}

message Approval {
  string mac_address = 1;
  string student_name = 2;
  string status = 3;
}

message ApprovalList {
  bool success = 1;
  repeated Approval approvals = 2;
  int32 total = 3;
  int32 page = 4;
  int32 limit = 5;
}

message SetApprovalResponse {
  bool success = 1;
  bool ok = 2;
}

message AutoApproveResponse {
  bool success = 1;
  bool enabled = 2;
}

message SetAutoApproveResponse {
  bool success = 1;
  bool enabled = 2;
}

// ---- Admin users ----
message CreateUserRequest {
  string username = 1;
  string password = 2;
  string role = 3;
}

message CreateUserResponse {
  bool success = 1;
  bool ok = 2;
  int32 id = 3;
  string username = 4;
  string role = 5;
  string error = 6;
}

message EditUserResponse {
  bool success = 1;
  bool ok = 2;
}

message DeleteUserResponse {
  bool success = 1;
  bool ok = 2;
}

message InstansiUpdateResponse {
  bool success = 1;
  bool ok = 2;
  string instansi = 3;
}

message InstansiUpdateRequest {
  string instansi = 1;
}

// ---- Admin vouchers ----
message RedeemVoucherRequest {
  string code = 1;
}

message RedeemVoucherResponse {
  bool success = 1;
  bool ok = 2;
  string error = 3;
}

message ActivateVoucherResponse {
  bool success = 1;
  bool ok = 2;
}

// ---- Settings ----
message UpdateSettingsResponse {
  bool success = 1;
  bool ok = 2;
}

// ---- API (student-facing) ----
message TimeResponse {
  bool success = 1;
  string server_time = 2;
  string timezone = 3;
}

message ListExamsResponse {
  bool success = 1;
  repeated string tokens = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 total = 5;
  int32 total_pages = 6;
}

message RequestApprovalResponse {
  bool success = 1;
  string status = 2;
}

message ExamByTokenResponse {
  bool success = 1;
  string token = 2;
  string status = 3;
  string error = 4;
}

message SubmitExamResponse {
  bool success = 1;
  string status = 2;
  string error = 3;
  string error_code = 4;
}

message ExamResultResponse {
  bool success = 1;
  int32 exam_id = 2;
  int32 score = 3;
  bool has_score = 4;
  string error = 5;
}

message AccessLogResponse {
  bool success = 1;
  bool logged = 2;
}

message CompleteExamResponse {
  bool success = 1;
  bool completed = 2;
}

// ---- Auth ----
message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string token = 2;
  string session_cookie = 3;
  string username = 4;
  string role = 5;
  string error = 6;
  string error_code = 7;
}

message LogoutResponse {
  bool success = 1;
  bool ok = 2;
}

// ---- Webhook ----
message WebhookRequest {
  string event = 1;
  string payload = 2;
}

message WebhookResponse {
  bool success = 1;
  string status = 2;
}

// ---- Hasil ----
message CekHasilApiResponse {
  bool success = 1;
  bool ok = 2;
  int32 score = 3;
  string status = 4;
  string error = 5;
}

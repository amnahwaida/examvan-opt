worker_processes auto;
events { worker_connections 4096; }
http {
  # standalone: go_backend down agar nginx tetap start tanpa stack Go.
  # dual-run: ganti baris di bawah menjadi `server examvan-go-server:5000;`
  # dan hubungkan kedua compose ke network external yang sama.
  upstream go_backend { server 127.0.0.1:5001 down; }
  upstream cpp_backend { server webui-cpp:5000; }

  # Per-grup upstream switch (dok 05 §1): ubah map untuk cutover bertahap.
  # 0 = Go (legacy), 1 = C++ (baru). Default semua ke C++ setelah F8.
  map $request_uri $backend {
    default cpp_backend;
    ~^/ws/.* cpp_backend;          # F3: WS pindah pertama
    ~^/api/health.* cpp_backend;
    ~^/api/time.* cpp_backend;
    # contoh rollback: kembalikan grup ke Go
    # ~^/admin/api/exams.* go_backend;
  }

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
  limit_req_status 429;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
  # ssl placeholder: certbot or Cloudflare TLS (dummy to satisfy infra check)
  # ssl_certificate /etc/nginx/ssl/cert.pem; ssl_certificate_key /etc/nginx/ssl/key.pem;
  server {
    listen 80;
    # listen 443 ssl;
    limit_req zone=login burst=20 nodelay;
    proxy_http_version 1.1;
    location / {
      proxy_pass http://$backend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_connect_timeout 5s;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /api/health {
      proxy_pass http://$backend;
      access_log off;
      proxy_set_header Connection "";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }
}

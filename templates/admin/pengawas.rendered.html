<script>
 

var PENG_CURRENT_PAGE = 1;

function loadPengawasExams(page) {
    var el = document.getElementById('pengawasExamList');
    if (!el) return;

    if (page !== undefined) PENG_CURRENT_PAGE = page;
    var search = document.getElementById('pengawasSearch') ? document.getElementById('pengawasSearch').value.trim() : '';

    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--color-text-secondary);">Memuat data ujian...</div>';

    var url = '/admin/api/pengawas/exams?page=' + PENG_CURRENT_PAGE + '&per_page=10';
    if (search) url += '&search=' + encodeURIComponent(search);

    apiFetch(url, { headers: { 'Accept': 'application/json' } })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (!res || !res.success) {
                el.innerHTML = '<div style="text-align:center;padding:40px;color:#fca5a5;">Gagal memuat data' +
                    ' <div style="margin-top:12px;"><button type="button" class="btn-sm btn-primary" data-action="load-pengawas-exams">Coba Lagi</button></div></div>';
                return;
            }
            var exams = res.exams || [];
            if (res.stats) {
                setText('statTotalExam', res.stats.total_exams);
                setText('statActiveExam', res.stats.active_exams);
                setText('statTotalStudents', res.stats.total_students);
                setText('statSubmitted', res.stats.total_submitted);
            } else {
                updateStats(exams);
            }

            if (exams.length === 0) {
                var msg = res.is_privileged
                    ? 'Belum ada ujian yang tersedia.'
                    : 'Belum ada ujian yang ditugaskan kepada Anda sebagai pengawas.';
                if (search) msg = 'Pencarian tidak ditemukan.';
                el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--color-text-secondary);">' + msg + '</div>';
                renderPagination(res);
                return;
            }

            var html = '';
            for (var i = 0; i < exams.length; i++) {
                var ex = exams[i];
                var total = ex.total_students || 0;
                var sub = ex.submitted_count || 0;
                var pct = total > 0 ? Math.round(sub / total * 100) : 0;
                var barColor = pct >= 100 ? 'var(--color-success-light)' : (pct > 0 ? '#60a5fa' : 'var(--color-text-muted)');
                
                
                
                
                
                var statusHtml;
                if (ex.status === 'active') {
                    statusHtml = '<span class="status-badge status-active">Aktif</span>';
                } else if (ex.tombstoned) {
                    
                    
                    var tombTitle = 'Nonaktif otomatis oleh sistem saat paket berakhir/berganti atau masa aktif akun habis' + (ex.tombstoned_at ? ' (' + formatDateTimeID(ex.tombstoned_at) + ')' : '');
                    statusHtml = '<span class="status-badge status-tombstoned" title="' + escapeHtml(jsEscape(tombTitle)) + '">Nonaktif Otomatis</span>';
                } else {
                    statusHtml = '<span class="status-badge status-inactive">Nonaktif</span>';
                }
                
                
                var sched = (ex.start_time && ex.end_time)
                    ? (formatDateTimeID(ex.start_time) + ' - ' + formatDateTimeID(ex.end_time))
                    : '—';

                var startedBadge = ex.exam_started_at
                    ? '<span style="font-size:0.65rem;color:rgba(var(--rgb-success),0.8);padding:2px 6px;border-radius:4px;background:rgba(var(--rgb-success),0.1);border:1px solid rgba(var(--rgb-success),0.2);"><svg class="icon-svg" style="width:10px;height:10px;"><use href="#hi-check"/></svg> Sedang Diawasi</span>'
                    : '<span style="font-size:0.65rem;color:rgba(var(--rgb-warning),0.8);padding:2px 6px;border-radius:4px;background:rgba(var(--rgb-warning),0.1);border:1px solid rgba(var(--rgb-warning),0.2);">Belum Mulai Pengawasan</span>';
                var modeBadge = ex.token_mode === 'static'
                    ? '<span style="font-size:0.7rem;color:#60a5fa;font-weight:600;background:rgba(59,130,246,0.1);padding:1px 4px;border-radius:4px;border:1px solid rgba(59,130,246,0.2);">Statis</span>'
                    : '<span style="font-size:0.7rem;color:#c084fc;font-weight:600;background:rgba(var(--rgb-accent),0.1);padding:1px 4px;border-radius:4px;border:1px solid rgba(var(--rgb-accent),0.2);">Dinamis</span>';
                
                
                
                var autoBadge = ex.auto_approve
                    ? '<span style="display:inline-flex;align-items:center;gap:4px;font-size:0.65rem;color:var(--color-success-light);font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(var(--rgb-success),0.12);border:1px solid rgba(var(--rgb-success),0.3);white-space:nowrap;" title="Auto-approve aktif — semua perangkat disetujui otomatis di server (tetap berlaku walau halaman pengawasan ditutup)"><svg class="icon-svg" style="width:10px;height:10px;"><use href="#hi-check"/></svg> Auto-approve</span>'
                    : '';
                html += '<div class="exam-monitor-card" id="exam-card-' + ex.id + '" style="cursor:pointer;" role="button" tabindex="0" data-action="open-pengawas-detail" data-exam-id="' + ex.id + '"' +
                    ' aria-label="' + escapeHtml(jsEscape('Buka detail pengawasan ujian: ' + ex.name)) + '">' +
                    '<div class="exam-monitor-header">' +
                        '<div>' +
                            '<div class="exam-monitor-title">' + esc(ex.name) + ' ' + startedBadge + '</div>' +
                            '<div class="exam-monitor-meta">' +
                                '<span style="display:inline-flex;align-items:center;gap:4px;">Mode Token: ' + modeBadge + '</span>' +
                                '<span>Jadwal: ' + sched + '</span>' +
                                '<span>Pembuat: ' + esc(ex.creator_name) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<div style="display:flex;align-items:center;gap:8px;">' +
                            autoBadge +
                            statusHtml +
                            '<svg class="icon-svg" style="width:16px;height:16px;color:var(--color-primary-light);"><use href="#hi-chevron-right"/></svg>' +
                        '</div>' +
                    '</div>' +
                    '<div class="exam-monitor-progress">' +
                        '<div class="progress-bar-container">' +
                            '<div class="progress-bar-fill" style="width:' + pct + '%;background:' + barColor + ';"></div>' +
                        '</div>' +
                        '<span class="progress-text" style="color:' + barColor + ';">' + sub + '/' + total + ' (' + pct + '%)</span>' +
                        '<a href="/admin/pengawas/' + ex.id + '" class="student-list-toggle" style="text-decoration:none;"><svg class="icon-svg" style="width:14px;height:14px;"><use href="#hi-eye"/></svg> Pantau</a>' +
                    '</div>' +
                '</div>';
            }
            el.innerHTML = html;
            renderPagination(res);
        })
        .catch(function() {
            el.innerHTML = '<div style="text-align:center;padding:40px;color:#fca5a5;">Gagal menghubungi server' +
                ' <div style="margin-top:12px;"><button type="button" class="btn-sm btn-primary" data-action="load-pengawas-exams">Coba Lagi</button></div></div>';
        });
}

function renderPagination(res) {
    var pagEl = document.getElementById('pengawasPagination');
    if (!pagEl) return;
    if (!res.total_pages || res.total_pages <= 1) { pagEl.style.display = 'none'; return; }

    
    var perPage = 10;
    var rangeStart = (res.page - 1) * perPage + 1;
    var rangeEnd = Math.min(res.page * perPage, res.total);

    
    
    var html = '<div class="pagination-wrapper">' +
        '<span class="pagination-info">Menampilkan ' + rangeStart + '&ndash;' + rangeEnd + ' dari ' + res.total + ' ujian</span>' +
        '<div class="pagination-links">';

    if (res.page > 1) {
        html += '<button type="button" class="pagination-page-num" data-action="load-pengawas-page" data-page="1" style="cursor:pointer;" aria-label="Halaman pertama">&laquo;</button>' +
            '<button type="button" class="pagination-page-num" data-action="load-pengawas-page" data-page="' + (res.page - 1) + '" style="cursor:pointer;" aria-label="Halaman sebelumnya">&lsaquo;</button>';
    }

    var start = Math.max(1, res.page - 2);
    var end = Math.min(res.total_pages, res.page + 2);
    for (var p = start; p <= end; p++) {
        html += '<button type="button" class="pagination-page-num' + (p === res.page ? ' page-current' : '') + '" data-action="load-pengawas-page" data-page="' + p + '" style="cursor:pointer;"' + (p === res.page ? ' aria-current="page"' : '') + '>' + p + '</button>';
    }

    if (res.page < res.total_pages) {
        html += '<button type="button" class="pagination-page-num" data-action="load-pengawas-page" data-page="' + (res.page + 1) + '" style="cursor:pointer;" aria-label="Halaman berikutnya">&rsaquo;</button>' +
            '<button type="button" class="pagination-page-num" data-action="load-pengawas-page" data-page="' + res.total_pages + '" style="cursor:pointer;" aria-label="Halaman terakhir">&raquo;</button>';
    }

    html += '</div></div>';
    pagEl.innerHTML = html;
    pagEl.style.display = 'block';
}

function updateStats(exams) {
    var total = exams.length, active = 0, students = 0, submitted = 0;
    for (var i = 0; i < exams.length; i++) {
        var e = exams[i];
        if (e.status === 'active') active++;
        students += e.total_students || 0;
        submitted += e.submitted_count || 0;
    }
    setText('statTotalExam', total);
    setText('statActiveExam', active);
    setText('statTotalStudents', students);
    setText('statSubmitted', submitted);
}

function setText(id, val) { var e = document.getElementById(id); if (e) e.textContent = val; }

function esc(s) {
    if (!s) return '—';
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
}





(function() {
  if (typeof Actions === 'undefined') return;
  Actions.register('load-pengawas-exams', function() { if (typeof loadPengawasExams === 'function') loadPengawasExams(); });
  Actions.register('open-pengawas-detail', function(el, ev) {
    var t = ev && ev.target;
    while (t && t !== el) {
      if (String(t.tagName).toUpperCase() === 'A') return;
      t = t.parentNode;
    }
    var id = el.getAttribute('data-exam-id');
    if (!id) return;
    window.location = '/admin/pengawas/' + id;
  });
  Actions.register('load-pengawas-page', function(el) {
    var p = parseInt(el.getAttribute('data-page'), 10);
    if (isNaN(p)) return;
    if (typeof loadPengawasExams === 'function') loadPengawasExams(p);
  });
})();






(function() {
  document.addEventListener('click', function(ev) {
    var t = ev.target;
    while (t && t !== document) {
      if (t.nodeType === 1 && String(t.tagName).toUpperCase() === 'A' &&
          String(t.className).indexOf('student-list-toggle') !== -1) {
        ev.stopPropagation();
        return;
      }
      t = t.parentNode;
    }
  }, true);
})();

 
(function() {
    loadPengawasExams();
})();



(function() {
    var input = document.getElementById('pengawasSearch');
    if (!input || input.dataset.liveSearchWired) return;
    input.dataset.liveSearchWired = '1';
    if (typeof initLiveSearch === 'function') {
        
        
        initLiveSearch(document.getElementById('pengawasSearch'), function() { loadPengawasExams(1); });
    } else {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); loadPengawasExams(1); }
        });
    }
})();
</script>

 <script>
 
 
 function toggleMenu() {
 var links = document.getElementById('navLinks');
 
 
 var wasOpen = !!(links && links.classList.contains('open'));
 var open = links.classList.toggle('open');
 document.getElementById('navOverlay').classList.toggle('active');
 var burger = document.getElementById('navHamburger');
 burger.innerHTML = open ? '✕' : '☰';
 burger.setAttribute('aria-expanded', open ? 'true' : 'false');
 document.body.style.overflow = open ? 'hidden' : '';
 if (wasOpen && !open) burger.focus();
 }
 Array.prototype.forEach.call(document.querySelectorAll('[data-nav-toggle]'), function (el) {
 el.addEventListener('click', toggleMenu);
 });
 function closeMenu() {
  var links = document.getElementById('navLinks');
  
  
  var wasOpen = !!(links && links.classList.contains('open'));
  if (links) links.classList.remove('open');
  var overlay = document.getElementById('navOverlay');
  if (overlay) overlay.classList.remove('active');
  var burger = document.getElementById('navHamburger');
  if (burger) {
   burger.innerHTML = '&#9776;';
   burger.setAttribute('aria-expanded', 'false');
   
   
   if (wasOpen) burger.focus();
  }
  document.body.style.overflow = '';
 }
 document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeMenu(); } });
 </script>

 <script>
 window.__turnstileEnabled = false;
 document.addEventListener('DOMContentLoaded', function() {
 const password = document.getElementById('password');
 const toggle = document.getElementById('togglePassword');
 if (password && toggle) {
  toggle.addEventListener('click', function() {
   const show = password.type === 'password';
   password.type = show ? 'text' : 'password';
   toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  });
 }
 const form = document.getElementById('loginForm');
 const btn = document.getElementById('loginSubmitBtn');
 if (form && btn) {
 form.addEventListener('submit', function(e) {
  if (window.__turnstileEnabled) {
   var tok = document.querySelector('input[name="cf-turnstile-response"]');
   if (!tok || !tok.value) {
    e.preventDefault();
    var terr = document.getElementById('turnstileError');
    if (terr) {
     terr.style.display = 'block';
     terr.textContent = 'Harap selesaikan verifikasi keamanan di atas terlebih dahulu.';
    }
    return;
   }
  }
  btn.classList.add('loading'); btn.disabled = true; btn.textContent = 'Memproses...';
 });
 if (document.querySelector('.flash-messages')) {
  btn.classList.remove('loading');
  btn.disabled = false;
 }
 }
  
 var successFlashes = document.querySelectorAll('.flash-msg:not(.flash-error)');
 if (successFlashes.length) {
  setTimeout(function() {
   successFlashes.forEach(function(el) {
    el.style.transition = 'opacity 0.5s ease';
    el.style.opacity = '0';
    setTimeout(function() { el.style.display = 'none'; }, 500);
   });
  }, 5000);
 }
 });
 </script>

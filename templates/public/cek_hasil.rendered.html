<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
 <meta name="theme-color" content="#09090e">
 

 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

 <link rel="stylesheet" href="/static/css/tailwind/output.css?v=2.7.3-983a6cca">
 
<link rel="stylesheet" href="/static/css/public-mobile.css?v=2.7.3-983a6cca">
 <link rel="stylesheet" href="/static/css/public-desktop.css?v=2.7.3-983a6cca">
 <link rel="icon" type="image/png" href="/static/favicon.png">
 <style>
   
  .login-form .form-group input { font-size: 16px; }
 </style>
</head>
<body class="login-page">
 

 <div class="nav-overlay" id="navOverlay" data-nav-toggle></div>
 <nav>
 <div class="nav-container">
 <a href="/" class="logo-container">
 <div class="logo-badge">E</div>
 <div class="logo-text">EXAMVAN</div>
 </a>
 <button class="nav-hamburger" id="navHamburger" data-nav-toggle aria-label="Menu navigasi" aria-expanded="false" aria-controls="navLinks">&#9776;</button>
 <div class="nav-links" id="navLinks">
 <a href="/download" class="nav-link">Unduh Aplikasi</a>
 <a href="/hasil" class="nav-link">Cek Hasil Ujian</a>
 
 <a href="/register" class="nav-link">Daftar</a>
 <a href="/login" class="btn-nav-login">Masuk</a>
 
 </div>
 </div>
 </nav>
 <script>
 
 
 function toggleMenu() {
 var links = document.getElementById('navLinks');
 
 
 var wasOpen = !!(links && links.classList.contains('open'));
 var open = links.classList.toggle('open');
 document.getElementById('navOverlay').classList.toggle('active');
 var burger = document.getElementById('navHamburger');
 burger.innerHTML = open ? '✕' : '☰';
 burger.setAttribute('aria-expanded', open ? 'true' : 'false');
 document.body.style.overflow = open ? 'hidden' : '';
 if (wasOpen && !open) burger.focus();
 }
 Array.prototype.forEach.call(document.querySelectorAll('[data-nav-toggle]'), function (el) {
 el.addEventListener('click', toggleMenu);
 });
 function closeMenu() {
  var links = document.getElementById('navLinks');
  
  
  var wasOpen = !!(links && links.classList.contains('open'));
  if (links) links.classList.remove('open');
  var overlay = document.getElementById('navOverlay');
  if (overlay) overlay.classList.remove('active');
  var burger = document.getElementById('navHamburger');
  if (burger) {
   burger.innerHTML = '&#9776;';
   burger.setAttribute('aria-expanded', 'false');
   
   
   if (wasOpen) burger.focus();
  }
  document.body.style.overflow = '';
 }
 document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeMenu(); } });
 </script>

 
  <a href="#main-content" class="skip-link">Langsung ke konten</a>
 
 <div class="login-bg">
 <div class="login-orb login-orb-1"></div>
 <div class="login-orb login-orb-2"></div>
 </div>
 <div class="login-container" id="main-content">
 <div class="login-card">
 <div class="login-header">
 <div class="login-logo">E</div>
 <h1>EXAMVAN</h1>
 <p class="login-subtitle">Cek Hasil Ujian</p>
 </div>

 

 <p style="font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin:0 0 16px;text-align:center;">
  Masukkan token ujian untuk melihat daftar nilai. Token (8 huruf/angka) diberikan oleh pengawas atau panitia ujian.
 </p>

 <form method="get" action="/hasil" class="login-form" id="cekHasilForm">
 <div class="form-group">
 <label class="required" for="token">Token Ujian</label>
 <input type="text" id="token" name="token" placeholder="Contoh: AB12CD34" maxlength="8" required autofocus autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" style="text-transform:uppercase;text-align:center;letter-spacing:4px;font-weight:700;">
 </div>
 <button type="submit" class="btn-login" id="cekHasilSubmitBtn">Lihat Hasil</button>
 </form>

 <div class="login-link-row" style="margin-top:14px;">
 <span class="login-link-text"><a href="/">← Kembali ke Beranda</a></span>
 </div>
 <div class="login-footer"><p>© 2026 EXAMVAN Team. All rights reserved.</p></div>
 </div>
 </div>
 <script>
 
 
 document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('cekHasilForm');
  var input = document.getElementById('token');
  if (form && input) {
   input.addEventListener('input', function() {
    if (this.value !== this.value.toUpperCase()) this.value = this.value.toUpperCase();
   });
   form.addEventListener('submit', function() {
    input.value = input.value.trim().toUpperCase();
   });
  }
 });
 </script>
</body>
</html>
